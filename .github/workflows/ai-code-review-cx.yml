name: AI Full Codebase Review - cx

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  ai-full-code-review:
    runs-on: self-hosted

    steps:
      # ------------------------------------------------
      # 1. Checkout selected branch
      # ------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ------------------------------------------------
      # 2. Setup Python environment
      # ------------------------------------------------
      - name: Setup Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      # ------------------------------------------------
      # 3. Collect repository files
      # ------------------------------------------------
      - name: Generate full codebase input
        run: |
          echo "Generating full codebase input"

          find .             -type f             -not -path "./.git/*"             -not -path "./.venv/*"             -not -path "./node_modules/*"             -not -path "./review_result.json"             -not -path "./full_code.txt"             -print             | sort             | while read -r file; do
                echo ""
                echo "=================================================="
                echo "FILE: $file"
                echo "=================================================="
                cat "$file"
              done             > full_code.txt

          if [ ! -s full_code.txt ]; then
            echo "ERROR: full_code.txt is empty"
            exit 1
          fi

          echo "Full codebase input generated"
          wc -l full_code.txt

      # ------------------------------------------------
      # 4. Run full AI code review
      # ------------------------------------------------
      - name: Run full AI code review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.REVIEW_CX_MODEL }}

          API_URL: ${{  vars.AI_REVIEW_API_URL }}
          REVIEW_MODE: FULL_CODEBASE
          REVIEW_SKILLS: "code-review,security-review"
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_CONTEXT: ${{ inputs.branch }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "ERROR: AI_REVIEW_API_URL is not configured"
            exit 1
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/ai_code_review.py"             --api-url "$API_URL"             --diff "$GITHUB_WORKSPACE/full_code.txt"             --pr-number "0"             --repository "$REPOSITORY"             --review-mode "$REVIEW_MODE"             --skills "$REVIEW_SKILLS"             --repository-context "$REPOSITORY_CONTEXT"

      # ------------------------------------------------
      # 5. Validate review result
      # ------------------------------------------------
      - name: Validate review result
        run: |
          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is missing or empty"
            exit 1
          fi

          .venv/bin/python -m json.tool             review_result.json             > /dev/null

          echo "Review result is valid"

      # ------------------------------------------------
      # 6. Upload report
      # ------------------------------------------------
      - name: Upload full review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-code-review-report
          path: |
            review_result.json
            full_code.txt
          if-no-files-found: warn

      # ------------------------------------------------
      # 7. Send reviewer notification
      # ------------------------------------------------
      - name: Send reviewer notification
        if: always()
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}
        run: |
          if [ ! -s review_result.json ]; then
            echo "No review result found; skipping email"
            exit 0
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/send_review_email.py"             --review-file review_result.json             --pr-number "0"             --repository "${{ github.repository }}"

      # ------------------------------------------------
      # 8. Resolve runner instance
      # ------------------------------------------------
      - name: Resolve runner instance
        if: always()
        id: resolve_instance
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not configured"
            exit 0
          fi

          if [ -z "$INTERNAL_API_TOKEN" ]; then
            echo "INTERNAL_API_TOKEN is not configured"
            exit 0
          fi

          RESPONSE=$(curl             --silent             --show-error             --fail             --max-time 30             "$BACKEND_URL/api/instances?repository_name=${{ github.repository }}"             -H "Authorization: Bearer $INTERNAL_API_TOKEN")

          INSTANCE_ID=$(echo "$RESPONSE"             | grep -o '"id"[[:space:]]*:[[:space:]]*[0-9]*'             | head -1             | grep -o '[0-9]*')

          if [ -z "$INSTANCE_ID" ]; then
            echo "Could not find instance ID"
            exit 0
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved instance ID: $INSTANCE_ID"

      # ------------------------------------------------
      # 9. Notify backend - complete runner
      # ------------------------------------------------
      - name: Notify backend - review complete
        if: always()
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          INSTANCE_ID: ${{ steps.resolve_instance.outputs.instance_id }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not configured; skipping"
            exit 0
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo "INSTANCE_ID is not available; skipping"
            exit 0
          fi

          HTTP_STATUS=$(curl             --silent             --show-error             --output /tmp/backend_complete_response.json             --write-out "%{http_code}"             --request POST             "$BACKEND_URL/api/ephemeral-runner/$INSTANCE_ID/complete"             -H "Content-Type: application/json"             -H "Authorization: Bearer $INTERNAL_API_TOKEN"             -d '{}'             --max-time 30)

          echo "Backend completion HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Backend notified successfully"
          else
            echo "Backend completion request failed"
            cat /tmp/backend_complete_response.json || true
            exit 1
          fi
