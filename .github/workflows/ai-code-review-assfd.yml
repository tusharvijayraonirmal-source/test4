name: AI Full Code Review - assfd

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review"
        required: true
        default: "main"
        type: string

      review_type:
        description: "Review type"
        required: true
        default: "full"
        type: string

      execution_id:
        description: "Review execution ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-full-code-review:
    runs-on:
      - self-hosted
      - linux
      - x64
      

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{inputs.branch }}

      - name: Ensure review scripts are up to date
        shell: bash
        run: |
          set -e

          git fetch origin main

          for script in scripts/ai_code_review.py scripts/claude_api.py scripts/publish_review.py scripts/send_review_email.py; do

            if git show "origin/main:$script" > "$script" 2>/dev/null; then
              echo "Synced $script from origin/main"
            else
              echo "WARNING: $script not found on origin/main, keeping checked-out copy"
            fi

          done

      - name: Debug checkout
        shell: bash
        run: |
          set -e

          echo "Full code review started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: ${{inputs.branch}}"
          echo "Commit:"
          git rev-parse HEAD

      - name: Setup Python virtual environment
        shell: bash
        run: |

          echo "======================================"
          echo "Python version check"
          echo "======================================"

          PYTHON_BIN="python3"

          if command -v python3.12 >/dev/null 2>&1; then

            PYTHON_BIN="python3.12"

          elif command -v python3.11 >/dev/null 2>&1; then

            PYTHON_BIN="python3.11"

          elif command -v python3.10 >/dev/null 2>&1; then

            PYTHON_BIN="python3.10"

          fi

          echo "Using Python binary: $PYTHON_BIN"
          "$PYTHON_BIN" --version

          echo "PATH=$PATH"

          echo "======================================"

          echo "Creating virtual environment..."

          rm -rf .venv

          "$PYTHON_BIN" -m venv .venv

          .venv/bin/python --version

          echo "Upgrading pip..."

          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          .venv/bin/python -m pip install -r requirements.txt

      - name: Generate full code input
        shell: bash
        run: |
          set -e

          echo "Generating full code input..."

          git ls-files             ':(exclude).git/*'             ':(exclude).venv/*'             ':(exclude)__pycache__/*'             ':(exclude)node_modules/*'             ':(exclude)review_result.json'             ':(exclude)full_code.txt'             ':(exclude)tracked_files.txt'             ':(exclude).github/workflows/*'             > tracked_files.txt

          : > full_code.txt

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "" >> full_code.txt
              echo "======================================" >> full_code.txt
              echo "FILE: $file" >> full_code.txt
              echo "======================================" >> full_code.txt
              cat "$file" >> full_code.txt
            fi
          done < tracked_files.txt

          echo "Tracked files:"
          wc -l tracked_files.txt

          echo "Full code lines:"
          wc -l full_code.txt

          if [ ! -s full_code.txt ]; then
            echo "ERROR: full_code.txt is empty"
            exit 1
          fi

      - name: Validate Claude configuration
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${ secrets.ANTHROPIC_AUTH_TOKEN }
          ANTHROPIC_BASE_URL: ${ vars.ANTHROPIC_BASE_URL }
          ANTHROPIC_MODEL: ${ vars.ANTHROPIC_MODEL }
        run: |
          set -e

          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ERROR: ANTHROPIC_AUTH_TOKEN is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "ERROR: ANTHROPIC_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_MODEL" ]; then
            echo "ERROR: ANTHROPIC_MODEL is missing"
            exit 1
          fi

          echo "Claude configuration is valid"
          echo "Claude base URL: $ANTHROPIC_BASE_URL"
          echo "Claude model: $ANTHROPIC_MODEL"

      - name: Run full AI code review
        shell: bash
        env:
          API_URL: ${{ vars.BACKEND_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REVIEW_MODE: FULL_CODEBASE
          REVIEW_SKILLS: "code-review,security-review"
          CLAUDE_MODEL: "claude-sonnet-5"
          REPOSITORY: ${{ github.repository }}
          REVIEW_BRANCH: ${{ inputs.branch }}
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          set -e

          echo "======================================"
          echo "Starting full AI code review"
          echo "======================================"

          echo "Execution ID: $EXECUTION_ID"
          echo "Repository: $REPOSITORY"
          echo "Review mode: $REVIEW_MODE"
          echo "Review branch: $REVIEW_BRANCH"
          echo "Claude model: $CLAUDE_MODEL"

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/ai_code_review.py"             --diff "$GITHUB_WORKSPACE/full_code.txt"             --pr-number "0"             --repository "$REPOSITORY"             --review-mode "$REVIEW_MODE"             --skills "$REVIEW_SKILLS"             --repository-context "$REVIEW_BRANCH"

      - name: Validate review result
        shell: bash
        run: |
          set -e

          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is missing or empty"
            exit 1
          fi

          .venv/bin/python             -m json.tool             review_result.json             > /dev/null 2>&1

          if [ $? -eq 0 ]; then
            echo "Review result is valid"
          else
            echo "ERROR: review_result.json contains invalid JSON"
            exit 1
          fi

      
      - name: Notify backend
        if: always()
        shell: bash
        env:
          BACKEND_URL: ${{vars.BACKEND_URL}}
          INSTANCE_NAME: ${{vars.REVIEW_INSTANCE_NAME}}
          INTERNAL_API_TOKEN: ${{secrets.INTERNAL_API_TOKEN}}
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -uo pipefail

          # Shell parameter-expansion delimiters are doubled below because this
          # block is embedded in a Python f-string and must be escaped.
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::warning::BACKEND_URL is not configured, skipping"
            exit 0
          fi

          if [ -z "${INTERNAL_API_TOKEN:-}" ]; then
            echo "::warning::INTERNAL_API_TOKEN is not configured, skipping"
            exit 0
          fi

          echo "Backend URL: $BACKEND_URL"
          echo "Repository: $REPOSITORY_NAME"
          echo "Instance name: ${INSTANCE_NAME:-not set}"

          # Verify backend connectivity (non-fatal)
          echo "Checking backend connectivity..."
          if ! curl -fsS --max-time 15 "$BACKEND_URL/openapi.json" -o /dev/null; then
            echo "::warning::Backend unreachable at $BACKEND_URL, skipping"
            exit 0
          fi

          # Retrieve the instance for this repository.
          # The backend expects the query parameter name `repository`.
          echo "Looking up repository instance..."

          RESPONSE=""
          if ! RESPONSE=$(curl -fsS --max-time 20             --get             --data-urlencode "repository=$REPOSITORY_NAME"             "$BACKEND_URL/api/instances"             -H "Authorization: Bearer $INTERNAL_API_TOKEN"); then
            echo "::warning::Instance lookup failed, skipping"
            exit 0
          fi

          # Extract the matching instance ID safely
          INSTANCE_ID=$(RESPONSE="$RESPONSE" REPO="$REPOSITORY_NAME" python3 -c '
          import json
          import os
          import sys

          data = json.loads(os.environ["RESPONSE"])
          repo = os.environ["REPO"]

          if isinstance(data, dict):
              items = data.get("items", data.get("instances", [data]))
          elif isinstance(data, list):
              items = data
          else:
              sys.exit("Unexpected response from instance API")

          match = next(
              (
                  item for item in items
                  if isinstance(item, dict)
                  and item.get("repository_name") == repo
                  and item.get("id") is not None
              ),
              None,
          )

          if match is None:
              sys.exit("No instance found for repository: " + repo)

          print(match["id"])
          ')

          echo "Found instance ID: $INSTANCE_ID"

          # Validate the review report
          if [ ! -s review_result.json ]; then
            echo "::error::review_result.json is missing or empty"
            exit 1
          fi

          # Validate JSON and construct the expected callback payload
          python3 -c '
          import json
          import os

          with open("review_result.json", encoding="utf-8") as f:
              review = json.load(f)

          with open("callback_payload.json", "w", encoding="utf-8") as f:
              json.dump(dict(
                  token=os.environ["INTERNAL_API_TOKEN"],
                  review=review,
              ), f)
          '

          # Send the result to FastAPI
          echo "Sending review result..."
          curl -fsS --max-time 30             -X POST             "$BACKEND_URL/api/ephemeral-runner/$INSTANCE_ID/complete"             -H "Content-Type: application/json"             --data-binary @callback_payload.json

          echo "Review result sent successfully."


      - name: Build Excel report
        if: always()
        shell: bash
        run: |
          set -e

          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is missing or empty"
            exit 1
          fi

          # Convert the review JSON into an .xlsx with the same column layout
          # the backend export endpoint uses, so the downloaded artifact and
          # the in-app Download Excel button produce identical files.
          .venv/bin/python - <<'PY'
          import json

          from openpyxl import Workbook
          from openpyxl.styles import Alignment, Font, PatternFill

          with open("review_result.json", encoding="utf-8") as f:
              review = json.load(f)

          wb = Workbook()
          ws = wb.active
          ws.title = "Review Results"

          header_fill = PatternFill(
              start_color="1F4E79", end_color="1F4E79", fill_type="solid"
          )
          header_font = Font(color="FFFFFF", bold=True, size=11)

          ws.append(["Title", "Description", "Priority", "Suggestion"])
          for cell in ws[1]:
              cell.fill = header_fill
              cell.font = header_font
              cell.alignment = Alignment(
                  horizontal="center", vertical="center"
              )

          findings = review.get("findings") or []

          for finding in findings:
              if not isinstance(finding, dict):
                  continue
              ws.append([
                  finding.get("issue") or "N/A",
                  finding.get("explanation") or "",
                  finding.get("severity") or "N/A",
                  finding.get("suggested_fix") or "",
              ])

          if not findings:
              ws.append([
                  "N/A",
                  review.get("summary") or "No findings",
                  "N/A",
                  "",
              ])

          for col in ws.columns:
              width = max(
                  (len(str(cell.value)) if cell.value else 0)
                  for cell in col
              )
              ws.column_dimensions[
                  col[0].column_letter
              ].width = min(width + 4, 80)

          ws.freeze_panes = "A2"
          wb.save("review_results.xlsx")
          print("Wrote review_results.xlsx")
          PY

      - name: Upload full review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-code-review-report
          path: |
            review_result.json
            review_results.xlsx
          if-no-files-found: warn

      - name: Send reviewer notification
        if: always()
        shell: bash
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}
        run: |
          if [ ! -s review_result.json ]; then
            echo "No review result found; skipping email"
            exit 0
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/send_review_email.py"             --review-file review_result.json             --pr-number "0"             --repository "$GITHUB_REPOSITORY"

        