name: AI PR Code Review - xcvfv

on:
pull_request:
    types:
    - opened
    - synchronize
    - reopened

permissions:
contents: read
pull-requests: write

jobs:
ai-pr-code-review:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
        uses: actions/checkout@v4
        with:
        fetch-depth: 0

    - name: Setup Python virtual environment
        run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt

    - name: Generate PR diff
        run: |
        git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > pr_diff.txt

        if [ ! -s pr_diff.txt ]; then
            echo "No changes found in pull request"
            exit 0
        fi

    - name: Run PR AI code review
        env:
        ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        REVIEW_MODE: PR
        REVIEW_SKILLS: "code-review,security-review"
        CLAUDE_MODEL: "claude-sonnet-5"
        REPOSITORY: ${{ github.repository }}
        run: |
        .venv/bin/python \
            "$GITHUB_WORKSPACE/scripts/ai_code_review.py" \
            --diff "$GITHUB_WORKSPACE/pr_diff.txt" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repository "$REPOSITORY" \
            --review-mode "$REVIEW_MODE" \
            --skills "$REVIEW_SKILLS"

    - name: Publish PR review
        if: always()
        env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
        if [ ! -s review_result.json ]; then
            echo "No review result found"
            exit 0
        fi

        echo "Review completed for PR ${{ github.event.pull_request.number }}"
